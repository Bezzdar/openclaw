services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: unified-elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=unified-es-cluster
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - path.repo=/usr/share/elasticsearch/backup
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - ./mart_meet/elasticServer/es_backups:/usr/share/elasticsearch/backup

  rag-backend:
    build:
      context: ./Little-main/backend
      dockerfile: Dockerfile
    container_name: unified-rag-backend
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    depends_on:
      - elasticsearch

  cognee-api:
    build:
      context: ./cognee-main
      dockerfile: Dockerfile
    container_name: unified-cognee-api
    environment:
      - ENV=local
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8000
      - REQUIRE_AUTHENTICATION=false
      - ENABLE_BACKEND_ACCESS_CONTROL=false
      - LLM_PROVIDER=ollama
      - LLM_MODEL=qwen3.5:4b
      - LLM_ENDPOINT=http://10.0.10.153:11434/v1
      - LLM_API_KEY=ollama
      - EMBEDDING_PROVIDER=ollama
      - EMBEDDING_MODEL=qwen3-embedding:0.6b
      - EMBEDDING_DIMENSIONS=1024
      - EMBEDDING_ENDPOINT=http://10.0.10.153:11434/v1/embeddings
      - HUGGINGFACE_TOKENIZER=Qwen/Qwen3-Embedding-0.6B
    ports:
      - "8001:8000"
    volumes:
      - ./data/cognee/databases:/app/cognee/.cognee_system/databases
      - ./data/cognee/logs:/app/logs
    profiles:
      - cognee

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: unified-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    profiles:
      - debug

volumes:
  es-data:
